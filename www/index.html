<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Scanner Forniture">
    <meta name="description" content="Scanner QR per gestione forniture - App offline">
    
    <title>Scanner Forniture Blu Notte</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%230f172a' width='192' height='192'/><text x='96' y='120' font-size='100' font-weight='bold' text-anchor='middle' fill='%2338bdf8' font-family='Arial'>ðŸ“¦</text></svg>">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --success: #22c55e;
            --danger: #ef4444;
        }

        * {
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding-top: max(env(safe-area-inset-top), 0);
        }

        .container {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 15px;
            max-width: 500px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }

        h2 {
            text-align: center;
            color: var(--accent);
            margin: 0 0 25px 0;
            font-size: 24px;
        }

        h3 {
            border-bottom: 2px solid #334155;
            padding-bottom: 8px;
            color: var(--text-muted);
            font-size: 12px;
            text-transform: uppercase;
            margin: 20px 0 15px 0;
            letter-spacing: 0.5px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 14px;
            color: var(--text-main);
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #334155;
            background: #0f172a;
            color: white;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
            font-family: inherit;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--accent);
            background: #0f172a;
        }

        .btn {
            display: inline-block;
            width: 100%;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            margin-top: 10px;
            color: white;
            transition: opacity 0.15s, transform 0.15s;
            font-family: inherit;
            -webkit-appearance: none;
        }

        .btn:active {
            opacity: 0.9;
            transform: scale(0.98);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-success {
            background-color: var(--success);
        }

        .btn-danger {
            background-color: var(--danger);
        }

        .btn-secondary {
            background-color: #475569;
        }

        .btn-sm {
            padding: 8px 12px;
            font-size: 12px;
            width: auto;
            margin: 5px 5px 5px 0;
            display: inline-block;
        }

        #reader {
            width: 100%;
            background: #000;
            border-radius: 12px;
            margin: 15px 0;
            display: none;
            min-height: 280px;
            max-height: 400px;
        }

        .list-container {
            margin-top: 20px;
            border-top: 2px solid #334155;
            padding-top: 15px;
        }

        .counter {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 250px;
            overflow-y: auto;
            border: 1px solid #334155;
            border-radius: 8px;
        }

        li {
            padding: 12px;
            border-bottom: 1px solid #334155;
            background: #1e293b;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }

        li:last-child {
            border-bottom: none;
        }

        .badge {
            background: #0ea5e9;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 600;
            white-space: nowrap;
            flex-shrink: 0;
            margin-left: 8px;
        }

        .log-match {
            text-align: center;
            margin: 10px 0;
            font-weight: 600;
            color: var(--accent);
            min-height: 28px;
            font-size: 16px;
        }

        .archive-item {
            background: #0f172a;
            border: 1px solid #334155;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .archive-info {
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--text-main);
        }

        .archive-date {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .button-group {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            padding: 30px 20px;
            font-size: 14px;
        }

        #scanner-area {
            display: none;
        }

        .install-banner {
            background: linear-gradient(135deg, var(--accent) 0%, #0ea5e9 100%);
            color: white;
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            display: none;
        }

        .install-banner button {
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            margin-top: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        @media (max-height: 500px) {
            #reader {
                min-height: 200px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div id="install-banner" class="install-banner">
        Aggiungi questa app alla home
        <button onclick="promptInstall()">Installa</button>
    </div>

    <h2> Scanner Forniture</h2>

    <div id="main-area">
        <div class="card">
            <h3>Nuova Sessione</h3>
            <div class="form-group">
                <label>Titolo Bolla</label>
                <input type="text" id="listTitle" placeholder="Fornitura Rossi 2026...">
            </div>
            <div class="form-group">
                <label>Filtro Prefisso (opzionale)</label>
                <input type="text" id="prefixFilter" placeholder="SN, S/N..." inputmode="text">
            </div>
            <button class="btn btn-success" onclick="startScanning(null)">â–¶ Avvia Scansione</button>
        </div>

        <div class="card">
            <h3>Archivio</h3>
            <div id="archive-list"></div>
        </div>
    </div>

    <div id="scanner-area" class="card">
        <div id="active-info" style="font-size: 13px; color: var(--text-muted); margin-bottom: 10px;"></div>
        <div id="feedback-message" class="log-match"></div>
        <div id="reader"></div>
        <button class="btn btn-danger" onclick="stopScanning()">â¹ Torna al Menu</button>
        <div class="list-container">
            <div class="counter">
                <span>Pezzi: <strong id="total-count">0</strong></span>
                <button id="btn-download" class="btn btn-sm btn-success" disabled onclick="exportCurrentToCSV()">â¬‡ Esporta CSV</button>
            </div>
            <ul id="serials-list"></ul>
        </div>
    </div>
</div>

<script>
    let html5QrCode = null;
    let currentListName = "";
    let deferredPrompt = null;

    // PWA Install Banner
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        document.getElementById('install-banner').style.display = 'block';
    });

    function promptInstall() {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            deferredPrompt = null;
            document.getElementById('install-banner').style.display = 'none';
        }
    }

    // Service Worker
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(err => console.log('SW non disponibile'));
    }

    document.addEventListener("DOMContentLoaded", renderArchive);

    function startScanning(existingListName) {
        let prefisso = document.getElementById('prefixFilter').value.trim();

        if (existingListName) {
            currentListName = existingListName;
            const archivio = JSON.parse(localStorage.getItem('forniture_archive')) || {};
            if(archivio[currentListName]?.prefisso) {
                document.getElementById('prefixFilter').value = archivio[currentListName].prefisso;
            }
        } else {
            currentListName = document.getElementById('listTitle').value.trim() || "Lista_" + new Date().getTime();
            const archivio = JSON.parse(localStorage.getItem('forniture_archive')) || {};
            if (!archivio[currentListName]) {
                archivio[currentListName] = {
                    prefisso,
                    data: new Date().toLocaleDateString('it-IT'),
                    seriali: []
                };
                localStorage.setItem('forniture_archive', JSON.stringify(archivio));
            }
        }

        document.getElementById('main-area').style.display = 'none';
        document.getElementById('scanner-area').style.display = 'block';
        document.getElementById('reader').style.display = 'block';
        aggiornaInterfacciaCorrente();

        html5QrCode = new Html5Qrcode("reader");
        const config = { fps: 10, qrbox: { width: 250, height: 250 } };
        const qrCodeSuccessCallback = onScanSuccess;
        const errorCallback = (error) => {};

        html5QrCode.start(
            { facingMode: "environment" },
            config,
            qrCodeSuccessCallback,
            errorCallback
        ).catch(err => {
            document.getElementById('feedback-message').innerText = "âŒ Accesso fotocamera negato";
            setTimeout(stopScanning, 2000);
        });
    }

    function onScanSuccess(decodedText) {
        const prefisso = document.getElementById('prefixFilter').value.trim();
        const archivio = JSON.parse(localStorage.getItem('forniture_archive'));

        if (prefisso) {
            const prefissiArray = prefisso.split(',').map(p => p.trim());
            const matchesPrefix = prefissiArray.some(p => decodedText.toLowerCase().includes(p.toLowerCase()));
            if (!matchesPrefix) {
                document.getElementById('feedback-message').innerText = "âŒ Prefisso errato";
                return;
            }
        }

        if (archivio[currentListName].seriali.includes(decodedText)) {
            document.getElementById('feedback-message').innerText = "âš  GiÃ  scansionato";
            return;
        }

        archivio[currentListName].seriali.push(decodedText);
        archivio[currentListName].prefisso = prefisso;
        localStorage.setItem('forniture_archive', JSON.stringify(archivio));
        document.getElementById('feedback-message').innerText = "âœ… " + decodedText;
        aggiornaInterfacciaCorrente();
    }

    function aggiornaInterfacciaCorrente() {
        const archivio = JSON.parse(localStorage.getItem('forniture_archive')) || {};
        const seriali = archivio[currentListName]?.seriali || [];
        document.getElementById('total-count').innerText = seriali.length;
        const listaUl = document.getElementById('serials-list');
        listaUl.innerHTML = seriali.length ? [...seriali].reverse().map(s => `<li>${s} <span class="badge">OK</span></li>`).join('') : '<div class="empty-state">Nessun seriale scansionato</div>';
        document.getElementById('btn-download').disabled = seriali.length === 0;
    }

    function stopScanning() {
        if (html5QrCode) {
            html5QrCode.stop().then(() => {
                document.getElementById('scanner-area').style.display = 'none';
                document.getElementById('main-area').style.display = 'block';
                renderArchive();
            }).catch(() => {
                document.getElementById('scanner-area').style.display = 'none';
                document.getElementById('main-area').style.display = 'block';
                renderArchive();
            });
        }
    }

    function renderArchive() {
        const archiveArea = document.getElementById('archive-list');
        const archivio = JSON.parse(localStorage.getItem('forniture_archive')) || {};
        const entries = Object.keys(archivio);

        if (!entries.length) {
            archiveArea.innerHTML = '<div class="empty-state">Nessuna lista salvata</div>';
            return;
        }

        archiveArea.innerHTML = entries.reverse().map(nome => `
            <div class="archive-item">
                <div class="archive-info">ðŸ“‹ ${nome}</div>
                <div class="archive-date">${archivio[nome].seriali.length} pezzi â€¢ ${archivio[nome].data}</div>
                <div class="button-group">
                    <button class="btn btn-sm btn-secondary" onclick="startScanning('${nome.replace(/'/g, "\\'")}')">Riprendi</button>
                    <button class="btn btn-sm btn-success" onclick="exportListToCSV('${nome.replace(/'/g, "\\'")}')">Esporta</button>
                    <button class="btn btn-sm btn-danger" onclick="deleteList('${nome.replace(/'/g, "\\'")}')">Elimina</button>
                </div>
            </div>
        `).join('');
    }

    function deleteList(n) {
        if(confirm("Eliminare lista '" + n + "'?")) {
            const a = JSON.parse(localStorage.getItem('forniture_archive'));
            delete a[n];
            localStorage.setItem('forniture_archive', JSON.stringify(a));
            renderArchive();
        }
    }

    function exportCurrentToCSV() {
        const archivio = JSON.parse(localStorage.getItem('forniture_archive'));
        const s = archivio[currentListName].seriali;
        exportCSV(s, currentListName);
    }

    function exportListToCSV(nome) {
        const archivio = JSON.parse(localStorage.getItem('forniture_archive'));
        const s = archivio[nome].seriali;
        exportCSV(s, nome);
    }

    function exportCSV(seriali, filename) {
        const header = "Numero di Serie\n";
        const content = seriali.map(s => `"${s}"`).join("\n");
        const csv = header + content;

        const link = document.createElement("a");
        link.href = "data:text/csv;charset=utf-8,\uFEFF" + encodeURIComponent(csv);
        link.download = filename + "_" + new Date().toISOString().slice(0,10) + ".csv";
        link.click();
    }
</script>

</body>
</html>
